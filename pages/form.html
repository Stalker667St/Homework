<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="stylesheet" href="../styles/style.css" />
    <title>Homework 3</title>
  </head>
  <body>
    <header class="header">
      <nav>
        <ul>
          <li><a href="../index.html">Головна</a></li>
          <li><a href="#form-element">Елементи форми</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="form-element">
        <h1>Форми</h1>
        <form class="form">
          <label for="name">Ім'я</label>
          <input type="text" id="name" name="name" size="50" required />
          <label for="check">Вибрати</label>
          <input type="checkbox" id="check" name="agree" value="yes" checked />

          <label for="range">Рівень(0-10)</label>
          <input
            type="range"
            id="range"
            name="range"
            min="0"
            max="10"
            value="4"
          />

          <label for="search">Пошук</label>
          <input type="search" id="search" name="search" minlength="8" />

          <label for="age">Вік</label>
          <input type="number" id="age" name="age" />

          <label for="book">Книги</label>
          <select id="book" name="book" required>
            <option value="">Оберіть книгу</option>
            <option value="fantasy">Фентезі</option>
            <option value="adventure">Пригоди</option>
            <option value="detective">Детектив</option>
            <option value="psychology">Психологія</option>
          </select>

          <label for="message">Повідомлення</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            cols="40"
            required
          ></textarea>

          <fieldset>
            <legend>Особисті інтереси:</legend>

            <input type="radio" id="music" name="interest" value="music" />
            <label for="music">Музика</label>

            <input type="radio" id="movie" name="interest" value="movie" />
            <label for="movie">Перегляд фільмів</label>

            <input type="radio" id="travel" name="interest" value="travel" />
            <label for="travel">Подорожі</label>
          </fieldset>

          <button type="submit">Надіслати</button>
          <button type="reset">Очистити</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <address>
        <a href="mailto:andriu.yakobishin@gmail.com"
          >andriu.yakobishin@gmail.com</a
        >
        <a href="tel:+380982338760">+380982338760</a>
      </address>
    </footer>
  </body>
</html>
