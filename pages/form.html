<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
    <title>My web site</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="nav-link">
          <ul>
            <li><a href="../index.html">Головна</a></li>
          </ul>
        </nav>

        <nav>
          <ul>
            <li><a href="#form-element">Елементи форми</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section id="form-element">
        <div class="container">
          <h1>Форми</h1>
          <form class="form">
            <label for="name">Ім'я</label>
            <input type="text" id="name" name="name" size="50" required />
            <label for="check">Вибрати</label>
            <input
              type="checkbox"
              id="check"
              name="agree"
              value="yes"
              checked
            />

            <label for="range">Рівень(0-10)</label>
            <input
              type="range"
              id="range"
              name="range"
              min="0"
              max="10"
              value="4"
            />

            <label for="search">Пошук</label>
            <input type="search" id="search" name="search" minlength="8" />

            <label for="age">Вік</label>
            <input type="number" id="age" name="age" />

            <label for="book">Книги</label>
            <select id="book" name="book" required>
              <option value="">Оберіть книгу</option>
              <option value="fantasy">Фентезі</option>
              <option value="adventure">Пригоди</option>
              <option value="detective">Детектив</option>
              <option value="psychology">Психологія</option>
            </select>

            <label for="message">Повідомлення</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              cols="40"
              required
            ></textarea>

            <fieldset>
              <legend>Особисті інтереси:</legend>

              <input type="radio" id="music" name="interest" value="music" />
              <label for="music">Музика</label>

              <input type="radio" id="movie" name="interest" value="movie" />
              <label for="movie">Перегляд фільмів</label>

              <input type="radio" id="travel" name="interest" value="travel" />
              <label for="travel">Подорожі</label>
            </fieldset>

            <div class="form-buttons">
              <button type="submit">Надіслати</button>
              <button type="reset">Очистити</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <address>
          <a href="mailto:andriu.yakobishin@gmail.com"
            >andriu.yakobishin@gmail.com</a
          >
          <a href="tel:+380982338760">+380982338760</a>
        </address>
      </div>
    </footer>
  </body>
</html>
